services:
  db:
    image: postgres:18-trixie
    container_name: job_tracker_db_container
    environment:
      POSTGRES_USER: job_tracker_user
      POSTGRES_PASSWORD: Tracker@Local2026
      POSTGRES_DB: job_tracker_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: